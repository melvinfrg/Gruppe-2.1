<title>Fahrzeug-Checklisten</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#f4f8fb,#dfeaf3);color:#17324d}
#chooser{min-height:100vh;display:grid;place-items:center;padding:24px}
.panel{width:min(900px,100%);padding:36px;border-radius:24px;background:#fff;box-shadow:0 18px 55px #17324d22;text-align:center}
h1{margin:0 0 12px;font-size:clamp(28px,5vw,46px)}
.lead{margin:0 auto 30px;max-width:650px;color:#60788b;line-height:1.6}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.choice{display:block;padding:32px 20px;border:1px solid #d5e1ea;border-radius:18px;background:#f8fbfd;color:#17324d;text-decoration:none;cursor:pointer;transition:.18s}
.choice:hover{transform:translateY(-4px);box-shadow:0 12px 25px #17324d18;border-color:#4b94c8}
.choice:focus-visible{outline:4px solid #8bc9ee;outline-offset:3px}
.icon{font-size:42px;margin-bottom:12px}
.choice h2{margin:0;font-size:28px}
.choice p{margin:8px 0 0;color:#6d8495;font-size:14px}
#viewer{display:none;min-height:100vh}
.toolbar{height:58px;display:flex;align-items:center;gap:14px;padding:10px 14px;background:#17324d;color:#fff}
.toolbar button{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:700;color:#17324d;background:#fff}
#title{font-weight:700}
iframe{display:block;width:100%;height:calc(100vh - 58px);min-height:500px;border:0;background:#fff}
@media(max-width:650px){.choices{grid-template-columns:1fr}.panel{padding:25px 18px}}
</style>
</head>

</section>

function decodeBase64(value) {
  const binary = atob(value);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}

const chooser = document.getElementById("chooser");
const viewer = document.getElementById("viewer");
const frame = document.getElementById("frame");
const title = document.getElementById("title");

document.querySelectorAll("[data-vehicle]").forEach(link => {
  link.addEventListener("click", event => {
    event.preventDefault();
    const vehicle = link.dataset.vehicle;
    title.textContent = "Checkliste " + vehicle;
    frame.srcdoc = decodeBase64(originals[vehicle]);
    chooser.style.display = "none";
    viewer.style.display = "block";
    window.scrollTo(0, 0);
  });
});

document.getElementById("back").addEventListener("click", () => {
  frame.srcdoc = "";
  viewer.style.display = "none";
  chooser.style.display = "grid";
  history.replaceState(null, "", location.pathname);
});
</script>
