}function dateClass(value){
  if(!value) return '';
  const raw=String(value).trim();
  let d=null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(raw)){
    const [y,m,day]=raw.split('-').map(Number);
    d=new Date(y,m-1,day);
  }else if(/^\d{2}\.\d{2}\.\d{4}$/.test(raw)){
    const [day,m,y]=raw.split('.').map(Number);
    d=new Date(y,m-1,day);
  }else{
    const parsed=new Date(raw);
    if(!Number.isNaN(parsed.getTime())) d=new Date(parsed.getFullYear(),parsed.getMonth(),parsed.getDate());
  }
  if(!d || Number.isNaN(d.getTime())) return '';
  const today=new Date();
  const start=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const limit=new Date(start);
  limit.setDate(limit.getDate()+365);
  if(d<start) return 'date-expired';
  if(d<=limit) return 'date-warning';
  return 'date-ok';
}
function itemrow(x){
  let n=miss(x);
  let isHeading=x.target===''||x.target===null||typeof x.target==='undefined';
  if(isHeading){
    let isMain=/^↓?Rucksack\s+(Rot|Blau)\s+\d+/i.test(String(x.name||''))||/^Bestückungsliste/i.test(String(x.name||''));
    return `<div class="section-heading ${isMain?'main-heading':'sub-heading'}"><div class="heading-title">${esc(String(x.name||'').replace(/^↓/,'').trim())}</div><div class="heading-meta">${esc(x.module||x.place||'')}</div></div>`;
  }
  const isMed=x.group==='Medizintechnik';
  return `<div class="row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.group)}</div></div><div>${esc(x.module||x.place)}</div><div class="target-value"><span class="target-label">Soll: </span>${esc(x.target) || '—'}</div><div><input class="edit" type="number" min="0" value="${esc(val(x,'actual'))}" onchange="save('${x.id}','actual',this.value)"></div><div class="missing ${n===0?'ok':''}">${n}</div><div><input class="edit ${dateClass(val(x,'expiry'))}" value="${esc(val(x,'expiry'))}" placeholder="${esc(x.expiry||'')}" onchange="save('${x.id}','expiry',this.value)"></div>${isMed?`<div><input class="edit ${dateClass(val(x,'test'))}" value="${esc(val(x,'test'))}" placeholder="${esc(x.test||'')}" onchange="save('${x.id}','test',this.value)"></div>`:''}<div><input class="edit" value="${esc(val(x,'note'))}" placeholder="${esc(x.note||'')}" onchange="save('${x.id}','note',this.value)"></div></div>`;
}
function medrow(x){return `<div class="row med"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.place)}</div></div><div><input class="edit" value="${esc(val(x,'inventory'))}" onchange="save('${x.id}','inventory',this.value)"></div><div><input class="edit" value="${esc(val(x,'serial'))}" onchange="save('${x.id}','serial',this.value)"></div><div>${esc(x.place)}</div><div><input class="edit ${dateClass(val(x,'next'))}" type="date" value="${esc(val(x,'next'))}" onchange="save('${x.id}','next',this.value)"></div><div><input class="edit" value="${esc(val(x,'note'))}" placeholder="Fehlt / Vermerk" onchange="save('${x.id}','note',this.value)"></div></div>`}async function loadState(){
  if(!db){
    state=JSON.parse(localStorage.getItem('gw-all')||'{}');

  const {data,error}=await db.from('checklist_entries').select('id,values');

}
async function save(id,k,v){
  state[id]??={};
  state[id][k]=v;

}

}function stats(a){count.textContent=a.length;flagCount.textContent=base.filter(x=>miss(x)>0||val(x,'note')).length;totalMissing.textContent=base.reduce((n,x)=>n+miss(x),0)}function makeReport(){let a=base.filter(x=>miss(x)>0||val(x,'note'));report.textContent=a.length?a.map(x=>`${x.group} — ${x.name} — ${miss(x)?'fehlt: '+miss(x):''}${val(x,'note')?' — '+val(x,'note'):''} — ${x.place||x.module||''}`).join('\n'):'Keine Fehlmengen oder Vermerke.';report.classList.remove('hidden');report.scrollIntoView({behavior:'smooth'})}function exportData(){let b=new Blob([JSON.stringify({exported:new Date().toISOString(),entries:state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='49-96-3-checkliste-eingaben.json';a.click();URL.revokeObjectURL(a.href)}function downloadMissingReport(){
  if(typeof XLSX==='undefined'){
    alert('Die Excel-Funktion konnte nicht geladen werden. Bitte prüfe deine Internetverbindung und lade die Seite neu.');
    return;
  }

  const rows=[];
  const dateMeta=[];

  function parseDate(value){
    if(!value) return null;
    const s=String(value).trim();
    let m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(m) return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
    m=s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    if(m) return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));
    const d=new Date(s);
    return Number.isNaN(d.getTime())?null:d;
  }

  function dateStatus(value){
    const d=parseDate(value);
    if(!d) return '';
    d.setHours(0,0,0,0);
    const today=new Date();
    today.setHours(0,0,0,0);
    const limit=new Date(today);
    limit.setDate(limit.getDate()+365);
    if(d<today) return 'expired';
    if(d<=limit) return 'warning';
    return 'ok';
  }

  base.forEach(x=>{
    if(!x || !x.id) return;

    const target=x.target??'';
    const actual=val(x,'actual');
    const expiry=val(x,'expiry');

    // Prüfdatum wird nur bei Medizintechnik berücksichtigt.
    const inspectionValue=x.group==='Medizintechnik'?val(x,'next'):'';

    // IST muss ausdrücklich eingetragen sein; auch 0 ist gültig.
    const hasActual=actual!=='' && actual!==null && actual!==undefined;
    if(!hasActual) return;

    const soll=Number(target);
    const ist=Number(actual);
    if(target==='' || !Number.isFinite(soll) || !Number.isFinite(ist)) return;

    const missing=Math.max(0,soll-ist);
    if(missing<=0) return;

    const row={
      'Materialbezeichnung':x.name||'',
      'Ort/Kistennummer':x.place||'',
      'Anzahl fehlt':missing,
      'Ablaufdatum':expiry||''
    };

    // Nur Medizintechnik erhält weiterhin eine Prüfdatum-Spalte.
    if(x.group==='Medizintechnik'){
      row['Prüfdatum']=inspectionValue||'';
    }

    rows.push(row);
    dateMeta.push({
      expiry:dateStatus(expiry),
      inspection:x.group==='Medizintechnik'?dateStatus(inspectionValue):''
    });
  });

  if(!rows.length){
    alert('Es wurden keine auffälligen Materialien gefunden.');
    return;
  }

  const hasMedTech=rows.some(r=>Object.prototype.hasOwnProperty.call(r,'Prüfdatum'));
  const columns=hasMedTech
    ? ['Materialbezeichnung','Ort/Kistennummer','Anzahl fehlt','Ablaufdatum','Prüfdatum']
    : ['Materialbezeichnung','Ort/Kistennummer','Anzahl fehlt','Ablaufdatum'];

  const ws=XLSX.utils.json_to_sheet(rows,{header:columns});
  ws['!cols']=hasMedTech
    ? [{wch:42},{wch:20},{wch:14},{wch:16},{wch:16}]
    : [{wch:42},{wch:20},{wch:14},{wch:16}];

  const fills={
    ok:'C6EFCE',
    warning:'E4DFEC',
    expired:'FFC7CE'
  };

  function applyDateStyle(cell,status){
    if(!cell || !status) return;
    cell.s={
      fill:{patternType:'solid',fgColor:{rgb:fills[status]}},
      font:{color:{rgb:status==='expired'?'9C0006':status==='warning'?'7030A0':'006100'}}
    };
  }

  dateMeta.forEach((meta,i)=>{
    const rowNumber=i+2;
    applyDateStyle(ws['D'+rowNumber],meta.expiry);
    if(hasMedTech) applyDateStyle(ws['E'+rowNumber],meta.inspection);
  });

  ws['!autofilter']={ref:'A1:'+(hasMedTech?'E':'D')+(rows.length+1)};

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Auffällige Materialien');
  XLSX.writeFile(
    wb,
    'Auffaellige_Materialien_'+new Date().toISOString().slice(0,10)+'.xlsx',
    {cellStyles:true}
  );
}
